{% extends 'base.html' %}
{% block title %}{{ action }} Fee Structure{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-{% if action == 'Create' %}plus-circle{% else %}pencil{% endif %}"></i> {{ action }} Fee Structure</h2>
    <a href="{% url 'finance:fee_structure_list' %}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Fee Name *</label>
                        {{ form.name }}
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fee Type *</label>
                            {{ form.fee_type }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Amount *</label>
                            {{ form.amount }}
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        {{ form.description }}
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            {{ form.is_mandatory }}
                            <label class="form-check-label" for="id_is_mandatory">
                                This fee is mandatory
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            {{ form.is_active }}
                            <label class="form-check-label" for="id_is_active">
                                Fee structure is active
                            </label>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-save"></i> {{ action }} Fee Structure
                        </button>
                        <a href="{% url 'finance:fee_structure_list' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
