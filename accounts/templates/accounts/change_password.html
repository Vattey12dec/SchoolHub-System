{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-key"></i> Change Password</h2>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Old Password</label>
                        {{ form.old_password }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        {{ form.new_password1 }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        {{ form.new_password2 }}
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Change Password</button>
                    <a href="{% url 'accounts:profile_settings' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
